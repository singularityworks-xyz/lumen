    <script>
    "use strict";
    // Always open at the top: this runs before first paint, so it
    // disables the browser's scroll restoration and strips any #hash
    // fragment (nav links like #canvas) before the browser can jump
    // the page to a mid-page section on refresh.
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    window.scrollTo(0, 0);
    window.addEventListener("pageshow", () => {
      window.scrollTo(0, 0);
    });
    </script>

    const isLocalhost =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1" ||
      window.location.hostname === "0.0.0.0" ||

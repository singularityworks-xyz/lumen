daemon off;

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout combined;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;
  fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
  uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
  scgi_temp_path /var/lib/nginx/tmp/scgi;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

  upstream elysia_workers {
    least_conn;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types application/json application/javascript application/xml text/css text/javascript text/plain text/xml;
    gzip_disable "msie6";

    location = /health {
      proxy_pass http://elysia_workers/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    location /api/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      limit_req_status 429;

      proxy_pass http://elysia_workers;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_request_buffering off;

      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=api_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://elysia_workers;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    error_page 429 /429.json;
    location = /429.json {
      internal;
      default_type application/json;
      return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded","retryAfter":60}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
      internal;
      default_type application/json;
      return 503 '{"error":"Service Unavailable","message":"Server temporarily unavailable"}';
    }
  }
}
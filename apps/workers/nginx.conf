# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream configuration
upstream elysia_workers {
  least_conn;
  server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

# Main server
server {
  listen 80;
  listen [::]:80;
  server_name lumkers.itssingularity.com;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Logging
  access_log /var/log/nginx/lumen_workers_access.log;
  error_log /var/log/nginx/lumen_workers_error.log warn;

  # Client configuration
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  # Timeouts
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
  gzip_disable "msie6";

  # Health check endpoint (no rate limit)
  location /health {
    proxy_pass http://elysia_workers/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
  }

  # Auth endpoints (stricter rate limit)
  location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://elysia_workers;
    proxy_http_version 1.1;

    # Essential headers for Better Auth
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Disable buffering for auth
    proxy_buffering off;
    proxy_request_buffering off;

    # Connection keep-alive
    proxy_set_header Connection "";

    # Increase buffer sizes for auth
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # General API endpoints
  location / {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://elysia_workers;
    proxy_http_version 1.1;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Buffering
    proxy_buffering off;

    # Connection keep-alive
    proxy_set_header Connection "";
  }

  # Custom error pages
  error_page 429 /429.json;
  location = /429.json {
    internal;
    default_type application/json;
    return 429 ' {
      #$#%#$#placeholder03434#$#%#$#:#$#%#$#placeholder13434#$#%#$#,#$#%#$#placeholder23434#$#%#$#:#$#%#$#placeholder33434#$#%#$
    }
    ';
  }

  error_page 502 503 504 /50x.json;
  location = /50x.json {
    internal;
    default_type application/json;
    return 502 ' {
# OpenTelemetry Collector Configuration
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
      - key: service_name
        from_attribute: service.name
        action: upsert

  # Drop health check / infra probe spans
  filter/health-traces:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/healthz"'
        - 'attributes["http.route"] == "/"'
        - 'attributes["http.route"] == "/instance-id"'
        - 'attributes["url.path"] == "/health"'
        - 'attributes["url.path"] == "/"'
        - 'attributes["url.path"] == "/instance-id"'
        - 'IsMatch(name, "GET /health.*")'
        - 'name == "GET /"'
        - 'name == "GET /instance-id"'

  # Drop health check and noisy logs
  filter/health-logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, ".*[Hh]ealth check.*")'
        - 'IsMatch(body, ".*Root endpoint accessed.*")'
        - 'IsMatch(body, ".*Web environment variables loaded.*")'

  # Drop debug-level logs (only info+ in production)
  filter/log-level:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_INFO'

exporters:
  # Traces to Tempo via OTLP
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs to Loki via OTLP HTTP (Loki supports OTLP natively)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Metrics to Prometheus
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Debug logging (optional)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/health-traces, resource, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [filter/health-logs, filter/log-level, resource, batch]
      exporters: [otlphttp/loki]

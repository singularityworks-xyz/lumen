services:
  lumendb:
    image: postgres:18.3
    container_name: lumendb
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumendb
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
    ports:
      - "15432:5432"
    volumes:
      - lumendb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumendb"]
      interval: 5s
      timeout: 5s
      retries: 20

  lumencache:
    image: redis:8.6.2
    container_name: lumencache
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - lumencache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  supermemory:
    build:
      context: ../../
      dockerfile: docker/supermemory.Dockerfile
    container_name: lumensupermemory
    restart: unless-stopped
    environment:
      # LLM provider for memory extraction — GeneralCompute's OpenAI-compatible
      # endpoint. Keys are interpolated from the gitignored root .env
      # (passed via `docker compose --env-file`, see scripts/dev/infra.sh).
      OPENAI_BASE_URL: https://api.generalcompute.com/v1
      OPENAI_API_KEY: ${GENERALCOMPUTE_API_KEY:-}
      OPENAI_MODEL: deepseek-v3.1
      # Custom embedder: Google Gemini (gemini-embedding-2, 1024 dims —
      # pgvector caps at 2000, so full 3072d is not supported)
      SUPERMEMORY_EMBEDDING_PROVIDER: gemini
      SUPERMEMORY_EMBEDDING_MODEL: gemini-embedding-2
      SUPERMEMORY_EMBEDDING_DIMENSIONS: "1024"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "6767:6767"
    volumes:
      - supermemory-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6767/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve-enterprise:v0.40.27
    container_name: lumen-openobserve
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: root@lumen.dev
      ZO_ROOT_USER_PASSWORD: lumen
      ZO_HTTP_PORT: "15080"
    ports:
      - "127.0.0.1:15080:15080"
      - "127.0.0.1:15081:15081"
    volumes:
      - openobserve-data:/data

volumes:
  lumendb-data:
  lumencache-data:
  supermemory-data:
  openobserve-data:

services:
  lumendb:
    image: postgres:18.3
    container_name: lumendb
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumendb
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
    ports:
      - "15432:5432"
    volumes:
      - lumendb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumendb"]
      interval: 5s
      timeout: 5s
      retries: 20

  lumencache:
    image: redis:8.6.2
    container_name: lumencache
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - lumencache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  supermemory:
    image: supermemory/supermemory:latest
    container_name: lumensupermemory
    restart: unless-stopped
    environment:
      SUPERMEMORY_API_URL: http://localhost:6767
    ports:
      - "6767:6767"
    volumes:
      - supermemory-data:/app/.supermemory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve-enterprise:v0.40.27
    container_name: lumen-openobserve
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: root@lumen.dev
      ZO_ROOT_USER_PASSWORD: lumen
      ZO_HTTP_PORT: "15080"
    ports:
      - "127.0.0.1:15080:15080"
      - "127.0.0.1:15081:15081"
    volumes:
      - openobserve-data:/data

volumes:
  lumendb-data:
  lumencache-data:
  supermemory-data:
  openobserve-data:

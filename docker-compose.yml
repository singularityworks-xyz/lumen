services:
  postgres:
    image: postgres:18.1-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen_dev_password
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage/bun"
coverageThreshold = 0.95
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/packages/logger/**",
  "**/packages/native-bridge/**",
  "**/packages/db/**",
  "**/packages/ai/**",
  "**/packages/yjs-shared/**",
  "**/node_modules/**",
  "**/tests/config/**"
]

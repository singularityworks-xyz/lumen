name: "Release Native App"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: https://lumkers.itssingularity.com
  IS_TAURI_BUILD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Creates the GitHub Release once, before the platform matrix builds.
  # The matrix jobs only upload assets — without this, every parallel build
  # tries to create the same tag and the second one fails with
  # "already_exists".
  create-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release-id.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Get release metadata
        id: release
        shell: bash
        run: |
          APP_VERSION=$(node -p 'require("./apps/native/package.json").version')
          ROOT_VERSION=$(node -p 'require("./package.json").version')
          TAG_NAME="native-v${APP_VERSION}"
          PREVIOUS_TAG=$(git tag --list 'native-v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)

          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "root_version=${ROOT_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

          {
            echo "commit_list<<EOF"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty='- `%h` %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty='- `%h` %s'
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release.outputs.tag_name }}"
          if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists — skipping creation"
            exit 0
          fi

          # Build the notes in bash (never inline multi-line outputs into the
          # script — backtick-wrapped commit hashes would be executed)
          NOTES_FILE="$(mktemp)"
          {
            echo "## Native Release \`${TAG_NAME}\`"
            echo ""
            echo "**Native Version:** ${{ steps.release.outputs.app_version }}"
            echo "**Root Version:** ${{ steps.release.outputs.root_version }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ steps.release.outputs.sha_full }}"
            echo "**Latest Commit Message:** ${{ steps.release.outputs.message }}"
            echo "**Previous Native Tag:** ${{ steps.release.outputs.previous_tag || 'none' }}"
            echo ""
            echo "### Changes Since Previous Native Release"
            PREVIOUS_TAG="${{ steps.release.outputs.previous_tag || '' }}"
            if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "none" ]; then
              git log --pretty='- `%h` %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty='- `%h` %s'
            fi
            echo ""
            echo "---"
            echo ""
            echo "### Downloads"
            echo "- **Windows:** \`.msi\` or \`.exe\` installer"
            echo "- **macOS Intel:** \`x64.dmg\` or \`.app\`"
            echo "- **macOS Apple Silicon:** \`aarch64.dmg\` or \`.app\`"
            echo "- **Linux:** \`.AppImage\`"
          } > "${NOTES_FILE}"

          gh release create "${TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --title "Lumen Native v${{ steps.release.outputs.app_version }}" \
            --notes-file "${NOTES_FILE}"

      - name: Resolve release ID for asset uploads
        id: release-id
        shell: bash
        run: |
          RELEASE_ID="$(gh release view "${{ steps.release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" --json id --jq '.id')"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  # Build and release Tauri app for all platforms
  build-tauri:
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') }}
    needs: [create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            use-blacksmith-cache: false
          # macOS Intel
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
            use-blacksmith-cache: false
          # Linux x86_64 - AppImage only (Blacksmith)
          - platform: "blacksmith-4vcpu-ubuntu-2204"
            args: "--bundles appimage"
            rust-targets: ""
            use-blacksmith-cache: true
          # Windows x86_64 (Blacksmith)
          - platform: "blacksmith-4vcpu-windows-2025"
            args: ""
            rust-targets: ""
            use-blacksmith-cache: true

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'blacksmith-4vcpu-ubuntu-2204'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Blacksmith Rust cache for faster CI on Blacksmith runners
      - name: Setup Rust cache (Blacksmith)
        if: matrix.use-blacksmith-cache
        uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "./apps/native/src-tauri -> target"

      # Standard Rust cache for non-Blacksmith runners (macOS)
      - name: Setup Rust cache (GitHub)
        if: ${{ !matrix.use-blacksmith-cache }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/native/src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get release metadata
        id: release
        shell: bash
        run: |
          APP_VERSION=$(node -p 'require("./apps/native/package.json").version')
          ROOT_VERSION=$(node -p 'require("./package.json").version')
          TAG_NAME="native-v${APP_VERSION}"
          PREVIOUS_TAG=$(git tag --list 'native-v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)

          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "root_version=${ROOT_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

          {
            echo "commit_list<<EOF"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty='- `%h` %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty='- `%h` %s'
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          IS_TAURI_BUILD: ${{ env.IS_TAURI_BUILD }}
        with:
          projectPath: apps/native
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: ${{ steps.release.outputs.tag_name }}
          releaseName: Lumen Native v${{ steps.release.outputs.app_version }}
          releaseBody: |
            ## Native Release `${{ steps.release.outputs.tag_name }}`

            **Native Version:** ${{ steps.release.outputs.app_version }}
            **Root Version:** ${{ steps.release.outputs.root_version }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ steps.release.outputs.sha_full }}
            **Latest Commit Message:** ${{ steps.release.outputs.message }}
            **Previous Native Tag:** ${{ steps.release.outputs.previous_tag || 'none' }}

            ### Changes Since Previous Native Release
            ${{ steps.release.outputs.commit_list }}

            ---

            ### Downloads
            - **Windows:** `.msi` or `.exe` installer
            - **macOS Intel:** `x64.dmg` or `.app`
            - **macOS Apple Silicon:** `aarch64.dmg` or `.app`
            - **Linux:** `.AppImage`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # The release is created by the create-release job — matrix jobs
          # upload their platform assets to it via its ID, which also
          # prevents the parallel create/release race
          releaseId: ${{ needs.create-release.outputs.release_id }}

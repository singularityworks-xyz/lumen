name: "Release Native App"

on:
  push:
    branches:
      - origin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: https://lumkers.itssingularity.com
  IS_TAURI_BUILD: "true"

jobs:
  # Build and release Tauri app for all platforms
  build-tauri:
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM
          - platform: "macos-latest"
            container: ""
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          # macOS Intel
          - platform: "macos-latest"
            container: ""
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          # Linux x86_64 - AppImage only
          - platform: "ubuntu-22.04"
            container: ""
            args: "--bundles appimage"
            rust-targets: ""
          # Windows x86_64
          - platform: "windows-latest"
            container: ""
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/native/src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get commit info
        id: commit
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          IS_TAURI_BUILD: ${{ env.IS_TAURI_BUILD }}
        with:
          projectPath: apps/native
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: v${{ steps.commit.outputs.sha_short }}
          releaseName: ${{ steps.commit.outputs.message }}
          releaseBody: |
            ## Release from commit `${{ steps.commit.outputs.sha_short }}`

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ steps.commit.outputs.sha_full }}
            **Message:** ${{ steps.commit.outputs.message }}

            ---

            ### Downloads
            - **Windows:** `.msi` or `.exe` installer
            - **macOS Intel:** `x64.dmg` or `.app`
            - **macOS Apple Silicon:** `aarch64.dmg` or `.app`
            - **Linux:** `.AppImage`
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeUpdaterJson: true

          path: playwright-report
          retention-days: 14

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.build.result == 'success' &&
      needs.unit-web.result == 'success' &&
      needs.unit-server-and-packages.result == 'success' &&
      needs.integration-web.result == 'success' &&
      needs.integration-workers.result == 'success' &&
      (needs.presence-tests.result == 'success' || needs.presence-tests.result == 'skipped') &&
      (needs.coverage-gate.result == 'success' || needs.coverage-gate.result == 'skipped') &&
      (needs.e2e-chromium.result == 'success' || needs.e2e-chromium.result == 'skipped') &&
      (needs.e2e-firefox.result == 'success' || needs.e2e-firefox.result == 'skipped') &&
      (needs.e2e-webkit.result == 'success' || needs.e2e-webkit.result == 'skipped') &&
      (needs.e2e-cross-browser.result == 'success' || needs.e2e-cross-browser.result == 'skipped') &&
      (needs.visual-regression.result == 'success' || needs.visual-regression.result == 'skipped')
    needs:
      - lint
      - type-check
      - build
      - unit-web
      - unit-server-and-packages
      - integration-web
      - integration-workers
      - presence-tests
      - coverage-gate
      - e2e-chromium
      - e2e-firefox
      - e2e-webkit
      - e2e-cross-browser
      - visual-regression
    steps:
      - name: Confirm CI status
        run: echo "All quality checks, tests, and build passed."

  deploy-web:
    name: Deploy Web
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.web == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/web-deploy.yml@origin
    secrets: inherit

  deploy-workers:
    name: Deploy Workers
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.workers == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/workers-deploy.yml@origin
    secrets: inherit

  deploy-presence:
    name: Deploy Presence
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.presence == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/presence-deploy.yml@origin
    secrets: inherit

  release-native:
    name: Release Native
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.native == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: write
    uses: singularityworks-xyz/lumen/.github/workflows/release-native.yml@origin
    secrets: inherit

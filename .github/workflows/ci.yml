name: CI

# Event matrix:
# - push to non-origin branches: lint + type-check only (fast feedback)
# - pull_request targeting origin: full CI quality gate (no deploy)
# - push to origin (post-merge): full CI + deploy/release jobs
#
# Note: E2E/visual regression are intentionally excluded from CI gating
# and are run manually via `.github/workflows/e2e-tests.yml` as they are more time-consuming and can be flaky.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ origin ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Targets
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    outputs:
      presence: ${{ steps.filter.outputs.presence }}
      native: ${{ steps.filter.outputs.native }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE_SHA="${{ github.event.pull_request.base.sha }}"
            AFTER_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
          fi
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$ZERO_SHA" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git ls-tree -r --name-only "$AFTER_SHA" > changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
          fi
          if rg -q '^(apps/web/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/native-bridge/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/web-deploy\.yml$)' changed-files.txt; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/workers/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/workers-deploy\.yml$)' changed-files.txt; then
            echo "workers=true" >> "$GITHUB_OUTPUT"
          else
            echo "workers=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/presence/|package\.json$|\.github/workflows/presence-deploy\.yml$)' changed-files.txt; then
            echo "presence=true" >> "$GITHUB_OUTPUT"
          else
            echo "presence=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/native/|scripts/install/|package\.json$|bun\.lock$|\.github/workflows/release-native\.yml$)' changed-files.txt; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Run lint checks
        run: bun run check:ci

  type-check:
    name: Type Check
    needs: [ lint ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run type checks
        run: bun run check-types

  build:
    name: Build
    needs: [ type-check ]
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Build all packages
        run: bun run build

  unit-web:
    name: Unit Web
    needs: [ type-check ]
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Run unit tests
        run: bash scripts/testing/run-unit.sh web
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-web
          path: coverage/bun/lcov.info
          retention-days: 7
      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-web
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  unit-server-and-packages:
    name: Unit Server & Packages
    needs: [ type-check ]
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Run unit tests
        run: bash scripts/testing/run-unit.sh workers packages
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-server-and-packages
          path: coverage/bun/lcov.info
          retention-days: 7
      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-server-and-packages
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  presence-tests:
    name: Presence Tests
    needs: [ changes, type-check ]
    if: (github.event_name == 'pull_request' || github.ref_name == 'origin') &&
      needs.changes.outputs.presence == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Cache Elixir/Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.hex
            ~/.cache/rebar3
            apps/presence/_build
            apps/presence/deps
          key: ${{ runner.os }}-beam-${{ hashFiles('apps/presence/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Compile Presence
        working-directory: apps/presence
        run: mix compile
      - name: Run Presence tests with coverage
        working-directory: apps/presence
        run: mix test --cover
      - name: Upload Presence coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-presence
          path: apps/presence/cover/lcov.info
          retention-days: 7

  integration-web:
    name: Integration Web
    needs: [ unit-web ]
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Build web and dependencies
        run: bunx turbo run build --filter=@lumen/web...
      - name: Push schema to test DB
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun run db:push
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/web/src/integration -name '*.test.ts' -o -name '*.test.tsx' | sort)
          exit_code=0
          for file in "${files[@]}"; do
            bun test --preload ./tests/config/web.setup.ts "${file}" || exit_code=$?
          done
          exit ${exit_code}

  integration-workers:
    name: Integration Workers
    needs: [ unit-server-and-packages ]
    if: github.event_name == 'pull_request' || github.ref_name == 'origin'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Build workers and dependencies
        run: bunx turbo run build --filter=@lumen/workers...
      - name: Push schema to test DB
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun run db:push
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/workers/src/integration -name '*.test.ts' | sort)
          exit_code=0
          for file in "${files[@]}"; do
            bun test --preload ./packages/db/src/setup/workers.setup.ts "${file}" || exit_code=$?
          done
          exit ${exit_code}

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' || github.ref_name == 'origin') &&
      always() &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.unit-web.result == 'success' || needs.unit-web.result == 'skipped') &&
      (needs.unit-server-and-packages.result == 'success' || needs.unit-server-and-packages.result == 'skipped') &&
      (needs.integration-web.result == 'success' || needs.integration-web.result == 'skipped') &&
      (needs.integration-workers.result == 'success' || needs.integration-workers.result == 'skipped') &&
      (needs.presence-tests.result == 'success' || needs.presence-tests.result == 'skipped')
    needs:
      - lint
      - type-check
      - build
      - unit-web
      - unit-server-and-packages
      - integration-web
      - integration-workers
      - presence-tests
    steps:
      - name: Confirm CI status
        run: echo "All quality checks, tests, and build passed."

  deploy-web:
    name: Deploy Web
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.web == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/web-deploy.yml@origin
    secrets: inherit

  deploy-workers:
    name: Deploy Workers
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.workers == 'true'
      }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/workers-deploy.yml@origin
    secrets: inherit

  deploy-presence:
    name: Deploy Presence
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.presence == 'true'
      }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/presence-deploy.yml@origin
    secrets: inherit

  release-native:
    name: Release Native
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.native == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: write
    uses: singularityworks-xyz/lumen/.github/workflows/release-native.yml@origin
    secrets: inherit

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun test --preload ./packages/db/src/setup/workers.setup.ts ./apps/workers/test/integration/*.test.ts

  coverage-gate:
    name: Coverage Summary
    runs-on: ubuntu-latest
    if: ${{ always() && needs.unit-web.result == 'success' && needs.unit-server-and-packages.result == 'success' }}
    needs:
      - changes
      - unit-web
      - unit-server-and-packages
      - presence-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Download unit-web coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit-web
          path: coverage/unit-web
      - name: Download unit-server-and-packages coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit-server-and-packages
          path: coverage/unit-server-and-packages
      - name: Download Presence coverage
        if: ${{ needs.presence-tests.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: coverage-presence
          path: coverage/presence
      - name: Setup Beam
        if: ${{ needs.presence-tests.result == 'success' }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Hex
        if: ${{ needs.presence-tests.result == 'success' }}
        run: mix local.hex --force
      - name: Merge LCOV files
        run: |
          mkdir -p coverage/merged
          lcov -a coverage/unit-web/lcov.info -a coverage/unit-server-and-packages/lcov.info -o coverage/merged/lcov.info
      - name: Generate coverage summary
        run: |
          BUN_LCOV_PATH=coverage/merged/lcov.info PRESENCE_LCOV_PATH=coverage/presence/lcov.info bun run scripts/testing/coverage-summary.ts
      - name: Run Presence coverage gate
        if: ${{ needs.presence-tests.result == 'success' && hashFiles('coverage/presence/lcov.info') != '' }}
        run: LCOV_PATH=coverage/presence/lcov.info elixir apps/presence/scripts/coverage_gate.exs

  e2e-chromium:
    name: E2E Chromium
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready

        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Setup Postgres test service
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          bun run db:gen
          bun run db:push
      - name: Seed auth/session fixtures
        run: bun run scripts/testing/seed-e2e-auth.ts
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright Chromium functional suite
        id: playwright
        run: bunx playwright test -c playwright/playwright.config.ts --project=chromium
      - name: Upload traces
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          retention-days: 14
      - name: Upload videos
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: test-results/**/video.webm
          retention-days: 14
      - name: Upload screenshots
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: test-results/**/screenshot.png
          retention-days: 14
      - name: Upload HTML report
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14


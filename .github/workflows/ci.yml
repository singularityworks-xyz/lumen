name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [origin]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Targets
    runs-on: ubuntu-latest
    outputs:
      presence: ${{ steps.filter.outputs.presence }}
      native: ${{ steps.filter.outputs.native }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$ZERO_SHA" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git ls-tree -r --name-only "$AFTER_SHA" > changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
          fi
          if rg -q '^(apps/web/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/native-bridge/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/web-deploy\.yml$)' changed-files.txt; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/workers/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/workers-deploy\.yml$)' changed-files.txt; then
            echo "workers=true" >> "$GITHUB_OUTPUT"
          else
            echo "workers=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/presence/|package\.json$|\.github/workflows/presence-deploy\.yml$)' changed-files.txt; then
            echo "presence=true" >> "$GITHUB_OUTPUT"
          else
            echo "presence=false" >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(apps/native/|scripts/install/|package\.json$|bun\.lock$|\.github/workflows/release-native\.yml$)' changed-files.txt; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Run lint checks
        run: bun run check:ci

  type-check:
    name: Type Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run type checks
        run: bun run check-types

  build:
    name: Build
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Build all packages
        run: bun run build

  unit-web:
    name: Unit Web
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Run unit tests
        run: bun test --preload ./tests/config/web.setup.ts ./apps/web/src/**/*.test.ts --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-web
          path: coverage/bun/lcov.info
          retention-days: 7
      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-web
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  unit-server-and-packages:
    name: Unit Server & Packages
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Run worker unit tests
        run: bun test --preload ./packages/db/src/setup/workers.setup.ts ./apps/workers/src/**/*.test.ts --coverage
      - name: Run package unit tests
        run: |
          bun test --preload ./tests/config/bun.setup.ts ./packages/ai/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/db/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/logger/src/sdk-node.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/logger/src/config.test.ts ./packages/logger/src/logger.test.ts ./packages/logger/src/tracer.test.ts ./packages/logger/src/metrics.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/native-bridge/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/yjs-shared/src/*.test.ts --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-server-and-packages
          path: coverage/bun/lcov.info
          retention-days: 7
      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-server-and-packages
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  presence-tests:
    name: Presence Tests
    needs: [changes, type-check]
    if: needs.changes.outputs.presence == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Cache Elixir/Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.hex
            ~/.cache/rebar3
            apps/presence/_build
            apps/presence/deps
          key: ${{ runner.os }}-beam-${{ hashFiles('apps/presence/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Compile Presence
        working-directory: apps/presence
        run: mix compile
      - name: Run Presence tests with coverage
        working-directory: apps/presence
        run: mix test --cover
      - name: Upload Presence coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-presence
          path: apps/presence/cover/lcov.info
          retention-days: 7

  integration-web:
    name: Integration Web
    needs: [unit-web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Push schema to test DB
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun run db:push
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun test --preload ./tests/config/web.setup.ts ./apps/web/test/integration/*.test.ts

  integration-workers:
    name: Integration Workers
    needs: [unit-server-and-packages]

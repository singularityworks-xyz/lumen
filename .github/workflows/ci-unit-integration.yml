name: CI Unit & Integration

on:
  push:
    branches:
      - "**"

jobs:
  changes:
    name: Detect Deploy Targets
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
            git ls-tree -r --name-only "$AFTER_SHA" > changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
          fi

          if rg -q '^(apps/web/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/native-bridge/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/web-deploy\.yml$)' changed-files.txt; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^(apps/workers/|packages/ai/|packages/configs/|packages/db/|packages/logger/|packages/yjs-shared/|scripts/install/|package\.json$|bun\.lock$|turbo\.json$|\.github/workflows/workers-deploy\.yml$)' changed-files.txt; then
            echo "workers=true" >> "$GITHUB_OUTPUT"
          else
            echo "workers=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^(apps/native/|scripts/install/|package\.json$|bun\.lock$|\.github/workflows/release-native\.yml$)' changed-files.txt; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Run type checks
        run: bun run check-types

  unit-web:
    name: Unit Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Run unit tests
        run: bun test --preload ./tests/config/web.setup.ts ./apps/web/src/**/*.test.ts --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-web
          path: coverage/
          retention-days: 7

      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-web
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  unit-server-and-packages:
    name: Unit Server & Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Run worker unit tests
        run: bun test --preload ./packages/db/src/setup/workers.setup.ts ./apps/workers/src/**/*.test.ts --coverage

      - name: Run package unit tests
        run: |
          bun test --preload ./tests/config/bun.setup.ts ./packages/ai/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/db/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/logger/src/sdk-node.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/logger/src/config.test.ts ./packages/logger/src/logger.test.ts ./packages/logger/src/tracer.test.ts ./packages/logger/src/metrics.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/native-bridge/src/*.test.ts --coverage
          bun test --preload ./tests/config/bun.setup.ts ./packages/yjs-shared/src/*.test.ts --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-server-and-packages
          path: coverage/
          retention-days: 7

      - name: Upload JUnit
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-server-and-packages
          path: junit.xml
          retention-days: 7
        continue-on-error: true

  integration-web:
    name: Integration Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Push schema to test DB
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun run db:push

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun test --preload ./tests/config/web.setup.ts ./apps/web/test/integration/*.test.ts

  integration-workers:
    name: Integration Workers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Push schema to test DB
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun run db:push

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: bun test --preload ./packages/db/src/setup/workers.setup.ts ./apps/workers/test/integration/*.test.ts

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs:
      - unit-web
      - unit-server-and-packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download unit-web coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit-web
          path: coverage

      - name: Download unit-server-and-packages coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit-server-and-packages
          path: coverage
          merge-multiple: true

      - name: Check LCOV thresholds
        run: bun run scripts/testing/check-lcov-thresholds.ts

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - quality
      - unit-web
      - unit-server-and-packages
      - integration-web
      - integration-workers
      - coverage-gate
    steps:
      - name: Confirm CI status
        run: echo "Quality checks and tests passed."

  deploy-web:
    name: Deploy Web
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.web == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/web-deploy.yml@origin
    secrets: inherit

  deploy-workers:
    name: Deploy Workers
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.workers == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: read
      packages: write
    uses: singularityworks-xyz/lumen/.github/workflows/workers-deploy.yml@origin
    secrets: inherit

  release-native:
    name: Release Native
    if: ${{ github.ref_name == 'origin' && needs.changes.outputs.native == 'true' }}
    needs:
      - changes
      - ci-passed
    permissions:
      contents: write
    uses: singularityworks-xyz/lumen/.github/workflows/release-native.yml@origin
    secrets: inherit

name: Prisma Schema Sync

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lumen-prisma-sync
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read root version metadata
        id: version
        shell: bash
        run: |
          ROOT_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          {
            echo "root_version=${ROOT_VERSION}"
            echo "tag_name=prisma-sync-v${ROOT_VERSION}"
            echo "sha_short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: lumen-prisma-sync

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag_name }}
            type=sha,prefix=prisma-sync-sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=lumen-prisma-sync
            org.opencontainers.image.version=${{ steps.version.outputs.root_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Lumen Prisma schema sync image
            io.lumen.app=prisma-sync
            io.lumen.root-version=${{ steps.version.outputs.root_version }}

      - name: Build and push Docker image (multi-arch)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./docker/prisma-sync.dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=lumen-prisma-sync
          cache-to: type=gha,mode=max,scope=lumen-prisma-sync
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Prisma sync container via Dokploy
        id: trigger-deploy
        if: success()
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PRISMA_APP_ID: ${{ secrets.DOKPLOY_PRISMA_APP_ID }}
        run: |
          set -eu

          if [ -z "$DOKPLOY_API_URL" ] || [ -z "$DOKPLOY_API_TOKEN" ] || [ -z "$DOKPLOY_PRISMA_APP_ID" ]; then
            echo "Missing Dokploy configuration. Set DOKPLOY_API_URL, DOKPLOY_API_TOKEN and DOKPLOY_PRISMA_APP_ID secrets."
            exit 1
          fi

          API_URL="${DOKPLOY_API_URL%/}"
          case "$API_URL" in
            http://*) API_URL="https://${API_URL#http://}" ;;
          esac

          BASELINE=$(curl -sS -L \
            "${API_URL}/api/deployment.all?applicationId=${DOKPLOY_PRISMA_APP_ID}" \
            -H 'accept: application/json' \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            | jq -r 'if type == "array" and length > 0 then .[0].deploymentId else "" end' 2>/dev/null || true)
          echo "baseline_deployment_id=${BASELINE}" >> "$GITHUB_OUTPUT"
          echo "Baseline deployment (pre-trigger): ${BASELINE:-none}"

          curl -L -X 'POST' \
            "${API_URL}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            -d "{\"applicationId\":\"${DOKPLOY_PRISMA_APP_ID}\"}" \
            --fail --silent --show-error

          echo "Prisma sync container triggered for application ${DOKPLOY_PRISMA_APP_ID}."

      - name: Wait for Prisma sync deployment
        if: success() && steps.trigger-deploy.outputs.baseline_deployment_id != ''
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PRISMA_APP_ID: ${{ secrets.DOKPLOY_PRISMA_APP_ID }}
          BASELINE_DEPLOYMENT_ID: ${{ steps.trigger-deploy.outputs.baseline_deployment_id }}
        run: |
          set -eu

          API_URL="${DOKPLOY_API_URL%/}"
          case "$API_URL" in
            http://*) API_URL="https://${API_URL#http://}" ;;
          esac
          APP_ID="${DOKPLOY_PRISMA_APP_ID}"
          BASELINE="${BASELINE_DEPLOYMENT_ID:-}"

          fetch_deployments() {
            curl -sS -L \
              "${API_URL}/api/deployment.all?applicationId=${APP_ID}" \
              -H 'accept: application/json' \
              -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
              || true
          }

          fetch_logs() {
            curl -sS -L \
              "${API_URL}/api/deployment.readLogs?deploymentId=${1}&tail=300" \
              -H 'accept: application/json' \
              -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
              || true
          }

          RETRIES=36
          for i in $(seq 1 "${RETRIES}"); do
            RESPONSE=$(fetch_deployments)
            if ! printf '%s' "$RESPONSE" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "deployment.all did not return an array. Check the Dokploy API endpoint / token."
              printf '%s\n' "$RESPONSE" | head -c 500
              echo ""
              exit 1
            fi
            DEPLOYMENT=$(printf '%s' "$RESPONSE" | jq -r 'if length > 0 then .[0] else empty end' 2>/dev/null || true)
            DEPLOYMENT_ID=$(printf '%s' "$DEPLOYMENT" | jq -r '.deploymentId // empty' 2>/dev/null || true)
            STATUS=$(printf '%s' "$DEPLOYMENT" | jq -r '.status // empty' 2>/dev/null || true)

            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "Attempt ${i}/${RETRIES}: no deployment record yet, waiting..."
              sleep 10
              continue
            fi

            if [ "$DEPLOYMENT_ID" = "$BASELINE" ]; then
              echo "Attempt ${i}/${RETRIES}: still on previous deployment (${DEPLOYMENT_ID}, ${STATUS}), waiting for new one..."
              sleep 10
              continue
            fi

            echo "Attempt ${i}/${RETRIES}: deployment ${DEPLOYMENT_ID} status: ${STATUS}"

            case "$STATUS" in
              done)
                echo "Prisma sync deployment ${DEPLOYMENT_ID} completed successfully."
                printf '%s\n' "$(fetch_logs "$DEPLOYMENT_ID")" | tail -n 50
                exit 0
                ;;
              error|failed|cancelled)
                echo "Prisma sync deployment ${DEPLOYMENT_ID} ended with status: ${STATUS}"
                printf '%s\n' "$(fetch_logs "$DEPLOYMENT_ID")" | tail -n 50
                exit 1
                ;;
              *)
                sleep 10
                continue
                ;;
            esac
          done

          echo "Timed out waiting for Prisma sync deployment to finish."
          exit 1

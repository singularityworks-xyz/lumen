name: Publish Supermemory Image

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lumen-supermemory
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version metadata
        id: version
        shell: bash
        run: |
          ROOT_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          # Single source of truth for the bundled server version lives in the Dockerfile
          SUPERMEMORY_VERSION=$(grep -oE '^ARG SUPERMEMORY_VERSION=.*' docker/supermemory.Dockerfile | cut -d= -f2)

          {
            echo "root_version=${ROOT_VERSION}"
            echo "supermemory_version=${SUPERMEMORY_VERSION}"
            echo "tag_name=supermemory-v${ROOT_VERSION}"
            echo "sha_short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: lumen-supermemory

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag_name }}
            type=raw,value=server-${{ steps.version.outputs.supermemory_version }}
            type=sha,prefix=supermemory-sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=lumen-supermemory
            org.opencontainers.image.version=${{ steps.version.outputs.root_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Self-hosted Supermemory server (single binary, no official image)
            io.lumen.app=supermemory
            io.lumen.app-version=${{ steps.version.outputs.root_version }}
            io.lumen.supermemory-version=${{ steps.version.outputs.supermemory_version }}

      - name: Build and push Docker image (multi-arch)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./docker/supermemory.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SUPERMEMORY_VERSION=${{ steps.version.outputs.supermemory_version }}
          cache-from: type=gha,scope=lumen-supermemory
          cache-to: type=gha,mode=max,scope=lumen-supermemory
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image reference
        run: |
          echo "Published: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "  tags: ${{ steps.version.outputs.tag_name }}, server-${{ steps.version.outputs.supermemory_version }}, latest"
          echo "  platforms: linux/amd64,linux/arm64"

  cleanup-old-images:
    needs: build-and-push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write

    steps:
      - name: Delete old package versions (keep last 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: lumen-supermemory
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - cross-browser
          - visual-regression

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{
    github.event.inputs.test-suite }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Generate Prisma client
        run: bun run db:gen
      - name: Build all packages
        run: bun run build

  e2e-chromium:
    name: E2E Chromium
    needs: [ build ]
    if: ${{ github.event.inputs.test-suite == 'all' ||
      github.event.inputs.test-suite == 'chromium' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Setup Postgres test service
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          bun run db:gen
          bun run db:push
      - name: Seed auth/session fixtures
        run: bun run scripts/testing/seed-e2e-auth.ts
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright Chromium functional suite
        id: playwright
        run: bunx playwright test -c playwright/playwright.config.ts --project=chromium
      - name: Upload traces
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          retention-days: 14
      - name: Upload videos
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: test-results/**/video.webm
          retention-days: 14
      - name: Upload screenshots
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: test-results/**/screenshot.png
          retention-days: 14
      - name: Upload HTML report
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14

  e2e-firefox:
    name: E2E Firefox
    needs: [ build ]
    if: ${{ github.event.inputs.test-suite == 'all' ||
      github.event.inputs.test-suite == 'firefox' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Setup Postgres test service
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          bun run db:gen
          bun run db:push
      - name: Seed auth/session fixtures
        run: bun run scripts/testing/seed-e2e-auth.ts
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps firefox
      - name: Run Playwright Firefox collaboration smoke
        id: playwright
        run: bunx playwright test -c playwright/playwright.config.ts --project=firefox
          apps/web/e2e/collaboration-live-sync.spec.ts
          apps/web/e2e/collaboration-drag-sync.spec.ts
          apps/web/e2e/collaboration-presence-lifecycle.spec.ts
          apps/web/e2e/collaboration-reconnect-recovery.spec.ts
          apps/web/e2e/collaboration-chat-comments.spec.ts
          apps/web/e2e/collaboration-permissions-and-delete.spec.ts
          apps/web/e2e/share-link-owner.spec.ts
          apps/web/e2e/share-link-editor.spec.ts
      - name: Upload traces
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-traces
          path: test-results/**/trace.zip
          retention-days: 14
      - name: Upload videos
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-videos
          path: test-results/**/video.webm
          retention-days: 14
      - name: Upload screenshots
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-screenshots
          path: test-results/**/screenshot.png
          retention-days: 14

  e2e-webkit:
    name: E2E WebKit
    needs: [ build ]
    if: ${{ github.event.inputs.test-suite == 'all' ||
      github.event.inputs.test-suite == 'webkit' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Setup Postgres test service
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          bun run db:gen
          bun run db:push
      - name: Seed auth/session fixtures
        run: bun run scripts/testing/seed-e2e-auth.ts
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps webkit
      - name: Run Playwright WebKit collaboration smoke
        id: playwright
        run: bunx playwright test -c playwright/playwright.config.ts --project=webkit
          apps/web/e2e/collaboration-live-sync.spec.ts
          apps/web/e2e/collaboration-drag-sync.spec.ts
          apps/web/e2e/collaboration-presence-lifecycle.spec.ts
          apps/web/e2e/collaboration-reconnect-recovery.spec.ts
          apps/web/e2e/collaboration-chat-comments.spec.ts
          apps/web/e2e/collaboration-permissions-and-delete.spec.ts
          apps/web/e2e/share-link-owner.spec.ts
          apps/web/e2e/share-link-editor.spec.ts
      - name: Upload traces
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-traces
          path: test-results/**/trace.zip
          retention-days: 14
      - name: Upload videos
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-videos
          path: test-results/**/video.webm
          retention-days: 14
      - name: Upload screenshots
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-screenshots
          path: test-results/**/screenshot.png
          retention-days: 14

  e2e-cross-browser:
    name: E2E Cross-Browser (Chrome + Firefox)
    needs: [ build ]
    if: ${{ github.event.inputs.test-suite == 'all' ||
      github.event.inputs.test-suite == 'cross-browser' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.0"
          version-type: strict
      - name: Install Presence dependencies
        working-directory: apps/presence
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Setup Postgres test service
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/lumen_test
        run: |
          bun run db:gen
          bun run db:push
      - name: Seed auth/session fixtures
        run: bun run scripts/testing/seed-e2e-auth.ts
      - name: Install Playwright browsers (Chrome + Firefox)
        run: bunx playwright install --with-deps chromium firefox
      - name: Run cross-browser sync tests
        id: playwright
        env:
          CROSS_BROWSER: "1"
        run: bunx playwright test -c playwright/playwright.config.ts --project=chromium
          apps/web/e2e/collaboration-cross-browser.spec.ts
      - name: Upload traces
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cross-browser-traces
          path: test-results/**/trace.zip
          retention-days: 14
      - name: Upload videos
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cross-browser-videos
          path: test-results/**/video.webm
          retention-days: 14
      - name: Upload screenshots
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cross-browser-screenshots
          path: test-results/**/screenshot.png
          retention-days: 14

  visual-regression:
    name: Visual Regression Chromium
    needs: [ build ]
    if: ${{ github.event.inputs.test-suite == 'all' ||
      github.event.inputs.test-suite == 'visual-regression' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cache
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install chromium
      - name: Run Playwright visual regression suite
        run: bunx playwright test -c playwright/playwright.visual.config.ts
          --project=chromium
        continue-on-error: true
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: test-results/**/diff-*.png
          retention-days: 14
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: playwright-report
          retention-days: 14

  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - e2e-chromium
      - e2e-firefox
      - e2e-webkit
      - e2e-cross-browser
      - visual-regression
    steps:
      - name: Check test results
        run: |
          echo "E2E test results:"
          echo "Chromium: ${{ needs.e2e-chromium.result }}"
          echo "Firefox: ${{ needs.e2e-firefox.result }}"
          echo "WebKit: ${{ needs.e2e-webkit.result }}"
          echo "Cross-Browser: ${{ needs.e2e-cross-browser.result }}"
          echo "Visual Regression: ${{ needs.visual-regression.result }}"

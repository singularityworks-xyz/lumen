name: CI Visual Regression

on:
  pull_request:
    branches:
      - main

jobs:
  visual-regression-chromium:
    name: Visual Regression Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Run Playwright visual regression suite
        run: bunx playwright test -c playwright.visual.config.ts --project=chromium
        continue-on-error: true

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: test-results/**/diff-*.png
          retention-days: 14

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: playwright-report
          retention-days: 14

name: Deploy Workers Service

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lumen-workers
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read workers version metadata
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("apps/workers/package.json"))["version"])')
          ROOT_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')

          {
            echo "app_version=${APP_VERSION}"
            echo "root_version=${ROOT_VERSION}"
            echo "tag_name=workers-v${APP_VERSION}"
            echo "sha_short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: lumen-workers

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag_name }}
            type=sha,prefix=workers-sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=lumen-workers
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Lumen workers service image
            io.lumen.app=workers
            io.lumen.app-version=${{ steps.version.outputs.app_version }}
            io.lumen.root-version=${{ steps.version.outputs.root_version }}

      - name: Build and push Docker image (multi-arch)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./apps/workers/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=lumen-workers
          cache-to: type=gha,mode=max,scope=lumen-workers
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy deployment via API
        if: success()
        run: |
          curl -X 'POST' \
            '${{ secrets.DOKPLOY_API_URL }}/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}' \
            -d '{"applicationId": "${{ secrets.DOKPLOY_WORKERS_APP_ID }}"}' \
            --fail --silent --show-error

      - name: Wait for deployment health check
        if: success()
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30

          echo "Checking health endpoint..."
          for i in {1..10}; do
            if curl -sf "${{ secrets.WORKERS_HEALTH_URL }}/health" > /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 10 attempts"
          exit 1

  cleanup-old-images:
    needs: build-and-push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write

    steps:
      - name: Delete old package versions (keep last 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: lumen-workers
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false

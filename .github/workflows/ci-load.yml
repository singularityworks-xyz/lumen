name: CI Load

on:
  workflow_dispatch:
    inputs:
      ws_url:
        description: WebSocket URL (wss://...)
        required: true
        type: string
      auth_token:
        description: Authentication token
        required: true
        type: string
      scenario:
        description: Scenario selector
        required: true
        type: choice
        options:
          - ramp
          - spike
          - soak
          - convergence
          - hybrid
      workspace_id:
        description: Shared workspace ID for convergence tests
        required: false
        type: string
        default: "ws-load-shared"
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ramp:
    name: Load Ramp
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario ==
      'ramp'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch the signing key directly from dl.k6.io; keyserver.ubuntu.com
          # is unreachable from GitHub runners ("keyserver receive failed").
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-agent.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 ramp test
        run: |
          k6 run load/k6/ws-collab-ramp.ts \
            -e WS_URL=${{ github.event.inputs.ws_url }} \
            -e AUTH_TOKEN=${{ github.event.inputs.auth_token }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id }}

  spike:
    name: Load Spike
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario ==
      'spike'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch the signing key directly from dl.k6.io; keyserver.ubuntu.com
          # is unreachable from GitHub runners ("keyserver receive failed").
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-agent.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 spike test
        run: |
          k6 run load/k6/ws-collab-spike.ts \
            -e WS_URL=${{ github.event.inputs.ws_url }} \
            -e AUTH_TOKEN=${{ github.event.inputs.auth_token }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id }}

  soak:
    name: Load Soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.scenario == 'soak')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch the signing key directly from dl.k6.io; keyserver.ubuntu.com
          # is unreachable from GitHub runners ("keyserver receive failed").
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-agent.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 soak test
        run: |
          k6 run load/k6/ws-collab-soak.ts \
            -e WS_URL=${{ github.event.inputs.ws_url || 'wss://staging.lumen.app' }} \
            -e AUTH_TOKEN=${{ github.event.inputs.auth_token || secrets.SOAK_AUTH_TOKEN }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id || 'ws-soak-shared' }}

  convergence:
    name: Load Convergence
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario ==
      'convergence'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch the signing key directly from dl.k6.io; keyserver.ubuntu.com
          # is unreachable from GitHub runners ("keyserver receive failed").
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-agent.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 convergence test
        run: |
          k6 run load/k6/ws-collab-convergence.ts \
            -e WS_URL=${{ github.event.inputs.ws_url }} \
            -e AUTH_TOKEN=${{ github.event.inputs.auth_token }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id || 'ws-convergence-test' }}

  hybrid:
    name: Hybrid Load
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario ==
      'hybrid'
    environment:
      name: load-test
      url: ${{ github.event.inputs.ws_url }}
    env:
      SCENARIO: hybrid
      PROTOCOL_VUS: "50"
      BROWSER_VUS: "3"
      COHORT_SIZE: "50"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch the signing key directly from dl.k6.io; keyserver.ubuntu.com
          # is unreachable from GitHub runners ("keyserver receive failed").
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-agent.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 hybrid test
        run: |
          k6 run load/k6/hybrid-load.ts \
            -e WS_URL=${{ github.event.inputs.ws_url }} \
            -e AUTH_TOKEN=${{ github.event.inputs.auth_token }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id || 'hybrid-load-test' }}

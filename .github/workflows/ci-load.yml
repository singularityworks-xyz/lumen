name: CI Load

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target base URL
        required: true
        type: string
      scenario:
        description: Scenario selector (ramp, spike, soak)
        required: true
        type: choice
        options:
          - ramp
          - spike
          - soak
      workspace_id:
        description: Workspace token or seeded workspace ID
        required: true
        type: string
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ramp:
    name: Load Ramp
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'ramp'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-agent.gpg --keyserver keyserver.ubuntu.com --recv-keys C5AD17C747E3415A3642D57D77C6C491D556AC9C
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 ramp test
        run: |
          k6 run load/k6/ws-collab-ramp.ts \
            -e BASE_URL=${{ github.event.inputs.base_url }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id }}

  spike:
    name: Load Spike
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'spike'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-agent.gpg --keyserver keyserver.ubuntu.com --recv-keys C5AD17C747E3415A3642D57D77C6C491D556AC9C
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 spike test
        run: |
          k6 run load/k6/ws-collab-spike.ts \
            -e BASE_URL=${{ github.event.inputs.base_url }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id }}

  soak:
    name: Load Soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'soak')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-agent.gpg --keyserver keyserver.ubuntu.com --recv-keys C5AD17C747E3415A3642D57D77C6C491D556AC9C
          echo "deb [signed-by=/usr/share/keyrings/k6-agent.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 soak test
        run: |
          k6 run load/k6/ws-collab-soak.ts \
            -e BASE_URL=${{ github.event.inputs.base_url || 'https://staging.lumen.app' }} \
            -e WORKSPACE_ID=${{ github.event.inputs.workspace_id || 'default-workspace' }}
